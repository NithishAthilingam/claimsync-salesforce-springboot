name: ClaimSync CI & Quality Gate Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  springboot-risk-service-tests:
    name: Java 21 Spring Boot Risk API (JUnit 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: springboot-risk-service
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Run JUnit 5 + MockMvc Suite
        run: mvn -B clean test

  python-qa-automation-suite:
    name: Python Quality Engineering & SFDX Contract Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-automation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: qa-automation/requirements.txt

      - name: Install QA Dependencies
        run: pip install -r requirements.txt

      - name: Run pytest Quality & SFDX Metadata Verification Suite
        run: pytest -v

  salesforce-dx-apex-validation:
    name: Salesforce DX (SFDX) Metadata & Apex Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salesforce-app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI (sf)
        run: npm install --global @salesforce/cli

      - name: Verify Salesforce CLI & Project Manifest
        run: |
          sf --version
          test -f sfdx-project.json
          test -f force-app/main/default/triggers/ClaimTrigger.trigger
          test -f force-app/main/default/classes/ClaimTriggerHandler.cls
          test -f force-app/main/default/classes/ClaimRiskScoringQueueable.cls
          test -f force-app/main/default/classes/ClaimTriggerTest.cls
